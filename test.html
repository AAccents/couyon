<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Couyon — Contact Sheet</title>
<style>
:root{
  --bg:#eef1f4; --panel:#fff; --ink:#17191c; --muted:#6b7280;
  --aa:#f58220; --line:#d7dce2; --ok:#0f6b45; --warn:#b45309; --bad:#b91c1c;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#111;color:#fff;padding:16px 22px;display:flex;align-items:center;
  justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:17px;margin:0}
.sub{font-size:12px;color:#b8bec7;margin-top:3px}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar label{font-size:12px;color:#b8bec7;display:flex;gap:6px;align-items:center}
select{padding:6px 8px;border:1px solid #444;border-radius:7px;background:#1c1f23;color:#fff;font-size:13px}
button{border:0;border-radius:7px;padding:7px 12px;font-weight:700;cursor:pointer;
  background:var(--aa);color:#fff;font-size:13px}
main{padding:20px 22px 60px}
.status{font-size:13px;color:var(--muted);margin:0 0 16px}
.status strong{color:var(--ink)}
.status .pass{color:var(--ok);font-weight:700}
.status .fail{color:var(--bad);font-weight:700}
section{margin-bottom:34px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 4px;color:#444}
.note{font-size:12px;color:var(--muted);margin:0 0 14px;max-width:70ch;line-height:1.5}
.grid{display:grid;gap:12px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;
  display:flex;flex-direction:column}
.cell.flag{border-color:#e9b384;box-shadow:0 0 0 2px #f6dcc4 inset}
.cell.bad{border-color:#e2a0a0;box-shadow:0 0 0 2px #f3cccc inset}
.cell.skip{opacity:.55}
.skipmsg{padding:22px 12px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.cap{padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;line-height:1.35}
.cap b{display:block;font-size:12px}
.cap span{color:var(--muted)}
.art{padding:6px;background:linear-gradient(#f8fafc,#eef2f6);display:flex;
  align-items:center;justify-content:center;min-height:150px}
.art svg{width:100%;height:auto;display:block;background:transparent}
.metrics{padding:7px 10px;border-top:1px solid var(--line);font-size:11px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;
  justify-content:space-between;gap:8px}
.r-ok{color:var(--ok);font-weight:700}
.r-warn{color:var(--warn);font-weight:700}
.r-bad{color:var(--bad);font-weight:700}
#rig{position:absolute;width:1000px;height:760px;left:-4000px;top:0;border:0}
.err{background:#fff;border:1px solid #f0c2c2;border-radius:11px;padding:16px;
  color:var(--bad);font-size:13px;line-height:1.55;max-width:80ch}
.err code{background:#f7eaea;padding:1px 4px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Couyon — Contact Sheet</h1>
    <div class="sub">Every finial x every post, driven through the real renderer</div>
  </div>
  <div class="bar">
    <label>Zoom
      <select id="zoom">
        <option value="finial">Finial joint</option>
        <option value="top">Upper assembly</option>
        <option value="base">Base joint</option>
        <option value="full">Full proof</option>
      </select>
    </label>
    <label>Blades
      <select id="blades">
        <option value="hide" selected>Hidden</option>
        <option value="show">Shown</option>
      </select>
    </label>
    <label>Cell size
      <select id="size">
        <option value="210">Small</option>
        <option value="280" selected>Medium</option>
        <option value="380">Large</option>
      </select>
    </label>
    <button id="rerun">Re-run</button>
  </div>
</header>

<main>
  <p class="status" id="status">Loading renderer&hellip;</p>
  <div id="out"></div>
</main>

<iframe id="rig" src="index.html" title="render rig"></iframe>

<script>
/* ---------------------------------------------------------------------------
   Contact sheet.

   This page contains NO geometry of its own. It drives index.html in a hidden
   same-origin iframe, sets the real controls, and extracts the SVG the real
   renderer produced. Duplicating any render logic here would defeat the point:
   the sheet must fail when the app is wrong, not agree with a second copy of
   the same mistake.

   See docs/ARCHITECTURE.md section 12.
--------------------------------------------------------------------------- */

const rig    = document.getElementById('rig');
const out    = document.getElementById('out');
const status = document.getElementById('status');

const VIEWS = {
  finial: '392 62 116 116',
  top:    '292 48 316 292',
  base:   '368 392 164 168',
  full:   '0 0 900 620',
};

function W() { return rig.contentWindow; }
function D() { return rig.contentDocument; }

function waitForRig() {
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    (function poll() {
      let ok = false;
      try {
        ok = !!(D() && D().getElementById('proof') &&
                D().getElementById('finial') &&
                D().getElementById('finial').options.length &&
                W().__proofDebug);
      } catch (e) { ok = false; }
      if (ok) return resolve();
      if (Date.now() - t0 > 8000) return reject(new Error('timeout'));
      setTimeout(poll, 60);
    })();
  });
}

/* Select by index, then poke the app's own input handler. */
function choose(id, index) {
  const el = D().getElementById(id);
  if (!el) return;
  el.value = el.options[index]?.value ?? String(index);
  el.dispatchEvent(new (W().Event)('input', { bubbles: true }));
}

/* Tick/untick one of the app's checkboxes through its own handler. */
function toggle(id, on) {
  const el = D().getElementById(id);
  if (!el) return;
  el.checked = !!on;
  el.dispatchEvent(new (W().Event)('input', { bubbles: true }));
}

/* Pull the rendered SVG out, retargeted to a zoom window. */
function grab(viewBox) {
  const src = D().getElementById('proof');
  const svg = src.cloneNode(true);
  svg.removeAttribute('id');
  svg.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  svg.setAttribute('viewBox', viewBox);
  svg.removeAttribute('width');
  svg.removeAttribute('height');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  // Strip <defs> — its ids would be duplicated across every cell on this page.
  const defs = svg.querySelector('defs');
  if (defs) defs.remove();
  return svg;
}

/* ---------------------------------------------------------------------------
   Mounting invariant.

   Measures the RENDERED OUTPUT rather than re-deriving geometry: the assembly
   is rasterised three times through the same SVG the app produced — once with
   the finial removed, once with the post removed, once whole — using the
   data-part hooks the renderer emits. The checks are then purely about pixels:

     ENTERS   the post is actually present above the mating plane
     NO GAP   no empty scanline anywhere across the joint
     COVERED  the finial silhouette is at least as wide as the post at every
              depth the post is inside it

   A failure here means the joint no longer reads as installed hardware,
   whatever the numbers in the renderer say.
--------------------------------------------------------------------------- */

const SS = 8;              // raster samples per SVG user unit
const CLEAR_TOL = -0.20;   // user units of slack for antialiasing

async function silhouette(svgEl, dropParts, win) {
  const s = svgEl.cloneNode(true);
  s.querySelectorAll('defs').forEach(d => d.remove());
  const bg = s.querySelector(':scope > rect');   // page-coloured backdrop
  if (bg) bg.remove();
  dropParts.forEach(part =>
    s.querySelectorAll('[data-part="' + part + '"]').forEach(n => n.remove()));
  s.setAttribute('viewBox', win.x + ' ' + win.y + ' ' + win.w + ' ' + win.h);
  const W = Math.round(win.w * SS), H = Math.round(win.h * SS);
  s.setAttribute('width', W); s.setAttribute('height', H);
  const src = new XMLSerializer().serializeToString(s);
  const img = new Image();
  await new Promise((res, rej) => {
    img.onload = res; img.onerror = rej;
    img.src = 'data:image/svg+xml;base64,' +
      btoa(unescape(encodeURIComponent(src)));
  });
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, W, H).data;
  const rows = new Float64Array(H);
  for (let py = 0; py < H; py++) {
    let lo = -1, hi = -1;
    for (let px = 0; px < W; px++) {
      if (d[(py * W + px) * 4 + 3] > 128) { if (lo < 0) lo = px; hi = px; }
    }
    rows[py] = lo < 0 ? 0 : (hi - lo + 1) / SS;
  }
  return rows;
}

async function mountInvariant(svgEl, dbg) {
  if (dbg.matingY == null || dbg.finialScale == null) return null;  // no finial mounted
  const win = { x: 410, y: dbg.matingY - 26, w: 80, h: 36 };        // stops short of the blades
  const row = y => Math.round((y - win.y) * SS);

  const postRows   = await silhouette(svgEl, ['finial'], win);
  const finialRows = await silhouette(svgEl, ['post-upper', 'post-lower', 'base'], win);
  const allRows    = await silhouette(svgEl, [], win);

  const rTop  = row(dbg.spineTop);
  const rMate = row(dbg.matingY);

  let gap = false;
  for (let r = Math.max(0, rTop - SS); r <= Math.min(allRows.length - 1, rMate + 2 * SS); r++) {
    if (allRows[r] <= 0) gap = true;
  }

  // The covered band is [spineTop, matingY) — the mating plane row itself is
  // where the collar legitimately ends and the post below it is meant to be
  // exposed, so it is not part of "the post is inside the collar".
  let postAbove = false, minClear = Infinity;
  for (let r = Math.max(0, rTop); r < Math.min(postRows.length, rMate); r++) {
    if (postRows[r] > 0) {
      postAbove = true;
      minClear = Math.min(minClear, finialRows[r] - postRows[r]);
    }
  }
  if (!isFinite(minClear)) minClear = null;

  // The post must ALSO emerge at full width immediately below the collar rim.
  // A taper there — the old rx = w/2 dome — is exactly the pinch that made an
  // installed finial read as two stacked objects, and it sits just outside the
  // covered band, so it needs its own check.
  let emergeMin = Infinity;
  for (let r = rMate + 1; r <= Math.min(postRows.length - 1, rMate + Math.round(1.5 * SS)); r++) {
    emergeMin = Math.min(emergeMin, postRows[r]);
  }
  const emerges = isFinite(emergeMin) && emergeMin >= dbg.postPxW - 0.35;

  const enters = dbg.embedPx > 0.05 && postAbove;
  return {
    enters, gap, minClear, emerges, emergeMin: isFinite(emergeMin) ? emergeMin : null,
    pass: enters && emerges && !gap && minClear !== null && minClear >= CLEAR_TOL
  };
}

/* ---------------------------------------------------------------------------
   Base-joint invariant.

   Same approach as the mounting invariant: measure the rendered output through
   the data-part hooks rather than re-deriving geometry.

     COVERED      the base is at least as wide as the post everywhere the post
                  is behind it
     CONTINUOUS   no empty scanline from the break down to grade
     EXPOSED RUN  a run of post is actually visible between the break marker and
                  the top of the base
     MARKER CLEAR the break marker lies entirely above the base
     GROUNDED     the base terminates at grade, not below it

   COVERED and GROUNDED are not applicable when no base is fitted.
--------------------------------------------------------------------------- */

const GROUND_TOL   = 0.5;    // user units a base may overhang grade
const RUN_FRACTION = 0.75;   // of the nominal exposed run, allowing for the clamp
const COVER_ENTRY_MAX = 3;   // user units of cap taper before the base must cover the post

async function baseInvariant(svgEl, dbg) {
  if (dbg.baseTopY == null) return null;
  const hasBase = dbg.baseStyle !== 'none';
  const win = { x: 395, y: dbg.lowerSectionTopY - 12,
                w: 110, h: (dbg.groundY + 12) - (dbg.lowerSectionTopY - 12) };
  const row = y => Math.round((y - win.y) * SS);

  const postRows = await silhouette(svgEl, ['base', 'finial', 'break'], win);
  const baseRows = await silhouette(svgEl, ['post-upper', 'post-lower', 'finial', 'break'], win);
  const bothRows = await silhouette(svgEl, ['finial', 'break'], win);

  const rBaseTop = row(dbg.baseTopY), rGround = row(dbg.groundY), rBreak = row(dbg.lowerSectionTopY);
  const last = bothRows.length - 1;

  // COVERED. A base's top is not a flat face — it is the apex of a cap, so the
  // first rows below baseTopY are a taper the post legitimately shows through.
  // Rather than pick an epsilon, find the row where the base FIRST reaches post
  // width and require both that it happens promptly and that coverage holds
  // from there to grade.
  let covMin = Infinity, entry = null;
  if (hasBase) {
    for (let r = Math.max(0, rBaseTop); r <= Math.min(last, rGround); r++) {
      if (baseRows[r] >= postRows[r] - CLEAR_TOL) { entry = r; break; }
    }
    if (entry !== null) {
      for (let r = entry; r < Math.min(last, rGround); r++) {
        if (postRows[r] > 0) covMin = Math.min(covMin, baseRows[r] - postRows[r]);
      }
    }
  }
  const entryPx = entry === null ? null : (entry - rBaseTop) / SS;
  const covered = !hasBase ? null
    : (entry !== null && entryPx <= COVER_ENTRY_MAX &&
       (!isFinite(covMin) || covMin >= CLEAR_TOL));

  // CONTINUOUS — the ground row is the terminating edge, not part of the body
  let continuous = true;
  for (let r = Math.max(0, rBreak); r < Math.min(last, rGround); r++) {
    if (bothRows[r] <= 0) continuous = false;
  }

  // EXPOSED RUN
  let runOk = true;
  for (let r = Math.max(0, rBreak); r < Math.min(last, rBaseTop); r++) {
    if (postRows[r] <= 0) runOk = false;
  }
  const runPx = dbg.exposedRun;
  const exposedOk = runOk && runPx >= RUN_FRACTION * dbg.minExposedRun;

  // MARKER CLEAR and GROUNDED — exact, from the live geometry
  let markerClear = true, grounded = null, spill = null;
  try {
    const mk = svgEl.querySelector('[data-part="break"]').getBBox();
    markerClear = !hasBase || (mk.y + mk.height) <= dbg.baseTopY + 0.01;
  } catch (e) { /* leave as measured default */ }
  if (hasBase) {
    try {
      const bb = svgEl.querySelector('[data-part="base"]').getBBox();
      spill = (bb.y + bb.height) - dbg.groundY;
      grounded = spill <= GROUND_TOL;
    } catch (e) { grounded = null; }
  }

  const checks = { covered, continuous, exposed: exposedOk, markerClear, grounded };
  const failed = Object.entries(checks).filter(([, v]) => v === false).map(([k]) => k);
  return { checks, failed, runPx, spill, entryPx,
           covMin: isFinite(covMin) ? covMin : null,
           pass: failed.length === 0 };
}

function ratioClass(r, target) {
  if (r == null) return '';
  const d = Math.abs(r - target) / target;
  if (d <= 0.02) return 'r-ok';
  if (d <= 0.25) return 'r-warn';
  return 'r-bad';
}

function cell(caption, sub, svg, dbg, target, inv, binv) {
  const c = document.createElement('div');
  c.className = 'cell';

  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.innerHTML = '<b></b><span></span>';
  cap.querySelector('b').textContent = caption;
  cap.querySelector('span').textContent = sub;
  c.appendChild(cap);

  const art = document.createElement('div');
  art.className = 'art';
  art.appendChild(svg);
  c.appendChild(art);

  if (dbg) {
    const m = document.createElement('div');
    m.className = 'metrics';
    const left  = document.createElement('span');
    const right = document.createElement('span');
    left.textContent = dbg.finialScale != null
      ? 'scale ' + dbg.finialScale.toFixed(4)
      : 'no finial';
    if (dbg.mateRatio != null) {
      right.textContent = 'socket ' + dbg.mateRatio.toFixed(2) + 'x post';
      right.className = ratioClass(dbg.mateRatio, target);
      if (ratioClass(dbg.mateRatio, target) === 'r-bad') c.classList.add('flag');
    } else {
      right.textContent = '—';
    }
    m.appendChild(left); m.appendChild(right);
    c.appendChild(m);
  }
  if (binv) {
    const v = document.createElement('div');
    v.className = 'metrics';
    const l = document.createElement('span'), r = document.createElement('span');
    l.textContent = 'base joint';
    if (binv.pass) {
      r.className = 'r-ok';
      r.textContent = 'PASS  run ' + binv.runPx.toFixed(0) +
        (binv.covMin !== null ? ', cover ' + binv.covMin.toFixed(2) : '') +
        (binv.entryPx !== null && binv.entryPx > 0 ? ', entry ' + binv.entryPx.toFixed(1) : '');
    } else {
      r.className = 'r-bad';
      r.textContent = 'FAIL  ' + binv.failed.join(', ');
      c.classList.add('bad');
    }
    v.appendChild(l); v.appendChild(r);
    c.appendChild(v);
  }
  if (inv) {
    const v = document.createElement('div');
    v.className = 'metrics';
    const l = document.createElement('span'), r = document.createElement('span');
    l.textContent = 'mount';
    if (inv.pass) {
      r.className = 'r-ok';
      r.textContent = 'PASS  clear ' + inv.minClear.toFixed(2);
    } else {
      r.className = 'r-bad';
      const why = [];
      if (!inv.enters) why.push('no entry');
      if (inv.gap) why.push('gap');
      if (!inv.emerges) why.push('pinched below rim ' +
        (inv.emergeMin === null ? '' : inv.emergeMin.toFixed(2)));
      if (inv.minClear !== null && inv.minClear < CLEAR_TOL) why.push('clear ' + inv.minClear.toFixed(2));
      if (inv.minClear === null && inv.enters) why.push('no covered band');
      r.textContent = 'FAIL  ' + (why.join(', ') || 'unknown');
      c.classList.add('bad');
    }
    v.appendChild(l); v.appendChild(r);
    c.appendChild(v);
  }
  return c;
}

function grid(cols) {
  const g = document.createElement('div');
  g.className = 'grid';
  g.style.gridTemplateColumns = 'repeat(auto-fill,minmax(' + cols + 'px,1fr))';
  return g;
}

function section(title, note) {
  const s = document.createElement('section');
  const h = document.createElement('h2');
  h.textContent = title;
  const p = document.createElement('p');
  p.className = 'note';
  p.textContent = note;
  s.appendChild(h); s.appendChild(p);
  return s;
}

// Inspect the actual SVG, not a second implementation of the station formulas.
function assemblyInvariant(doc, dbg) {
  const failures = [];
  const check = (condition, name) => { if (!condition) failures.push(name); };
  // getBBox() alone omits the element's own transform. Measure in proof space
  // so a misplaced or mirrored component cannot pass on its local coordinates.
  const bounds = node => {
    const b = node.getBBox();
    const matrix = doc.getElementById('proof').getCTM().inverse().multiply(node.getCTM());
    const points = [[b.x,b.y],[b.x+b.width,b.y],[b.x,b.y+b.height],[b.x+b.width,b.y+b.height]]
      .map(([x,y]) => new DOMPoint(x,y).matrixTransform(matrix));
    const x = Math.min(...points.map(p=>p.x)), y = Math.min(...points.map(p=>p.y));
    return { x, y, width: Math.max(...points.map(p=>p.x))-x, height: Math.max(...points.map(p=>p.y))-y };
  };
  const blades = [...doc.querySelectorAll('[data-part="blade"]')];
  const brackets = [...doc.querySelectorAll('[data-part="bracket"]')];
  const names = [...doc.querySelectorAll('[data-part="street-text"]')];
  const expected = ['noStreet1','noStreet2'].filter(id => !doc.getElementById(id).checked).length;
  check(blades.length === expected && names.length === expected, 'blade/name count');
  check(brackets.length === (W().selectedComponent('brackets').style === 'none' ? 0 : expected), 'bracket count');
  const boxes = blades.map(bounds).sort((a,b) => a.y-b.y);
  if (boxes.length) check(Math.abs(boxes[0].y - 125) < .01, 'upper station');
  if (boxes.length === 1) check(Math.abs(boxes[0].x + boxes[0].width/2 - 450) < .01, 'single centered');
  if (boxes.length === 2) check(boxes[0].y + boxes[0].height + 2.5 < boxes[1].y, 'faces overlap');
  if (boxes.length === 2) {
    const upperStreet = blades.reduce((a,b) => bounds(a).y < bounds(b).y ? a : b);
    check(upperStreet.dataset.street === (doc.getElementById('config').value === '1' ? '1' : '0'), 'street order');
  }
  for (const blade of blades) {
    const b = bounds(blade);
    const index = blade.dataset.street;
    check(b.x <= 450-dbg.postPxW/2 && b.x+b.width >= 450+dbg.postPxW/2, 'blade misses post');
    const label = bounds(names.find(n => n.dataset.street === index));
    check(label.x >= b.x+6 && label.x+label.width <= b.x+b.width-6 &&
          label.y >= b.y+2 && label.y+label.height <= b.y+b.height-2, 'lettering overflow');
    const bracket = brackets.find(n => n.dataset.street === index);
    if (bracket) {
      const r = bounds(bracket);
      check(r.x >= b.x-1 && r.x+r.width <= b.x+b.width+1, 'bracket wrong side');
      check(r.y >= b.y+b.height-1 && r.y <= b.y+b.height+1, 'rail detached');
      check(r.x < 450 && r.x+r.width > 450, 'bracket misses post');
      check(r.y+r.height < dbg.topSectionBottomY-2, 'bracket reaches break');
      for (const other of boxes) {
        if (other.y > b.y) check(r.y+r.height+2 < other.y, 'bracket hits next blade');
      }
    }
  }
  const upper = doc.querySelector('[data-part="post-upper"]');
  const base = doc.querySelector('[data-part="base"]');
  check(!!(upper.compareDocumentPosition(base) & 4), 'base painted behind post');
  check(dbg.lowerSectionTopY-dbg.topSectionBottomY <= 60, 'excessive break gap');
  const assembly = bounds(doc.getElementById('assembly'));
  check(assembly.x >= 0 && assembly.y >= 0 && assembly.x+assembly.width <= 900 &&
        assembly.y+assembly.height <= 620, 'canvas clipping');
  return { pass: failures.length === 0, failed: failures };
}

let runId = 0;

async function build() {
  const me = ++runId;                  // only the newest run may render
  out.textContent = '';
  status.textContent = 'Rendering…';

  try { await waitForRig(); }
  catch (e) {
    if (me !== runId) return;
    status.textContent = '';
    out.innerHTML = '<div class="err"><b>Could not reach the renderer.</b><br>' +
      'This page drives <code>index.html</code> in a same-origin iframe. That works when both ' +
      'files are served over http/https (GitHub Pages, or a local static server such as ' +
      '<code>python3 -m http.server</code>). Opening this file directly from disk with a ' +
      '<code>file://</code> URL will not work — the browser blocks cross-document access.</div>';
    return;
  }

  // Enumerate from the real controls — the app's own catalog bindings are
  // lexical (const), not window properties, and should not be exposed just for
  // this page. Driving the visible <select>s is also a truer test.
  const opts   = id => Array.from(D().getElementById(id).options).map(o => o.textContent.trim());
  const FINIALS = opts('finial'), POSTS = opts('post'), BASES = opts('base');
  const TARGET  = (W().__proofDebug && W().__proofDebug.collarRatio != null)
                    ? W().__proofDebug.collarRatio : 1.10;
  if (me !== runId) return;
  const view   = VIEWS[document.getElementById('zoom').value];
  const cols   = document.getElementById('size').value;

  // Deterministic starting state.
  const hideBlades = document.getElementById('blades').value === 'hide';
  choose('bracket', 0);
  choose('config', 0);
  choose('base', 1);
  toggle('noStreet1', hideBlades);
  toggle('noStreet2', hideBlades);

  let flagged = 0, total = 0, skipped = 0, invTotal = 0, invFail = 0;
  let bTotal = 0, bFail = 0, bSkipped = 0;

  // ---- finial x post -----------------------------------------------------
  const s1 = section(
    'Finial × post',
    'Socket-driven scale: every finial is scaled so its mating plane matches the post it ' +
    'sits on. "socket" is the rendered mating width as a multiple of post width — it ' +
    'should read ' + TARGET.toFixed(2) + 'x in every cell, on every post. "mount" is the ' +
    'measured mounting invariant: the post must actually enter the collar, there must be no ' +
    'empty scanline across the joint, and the finial must stay at least as wide as the post ' +
    'everywhere the post is inside it, and the post must emerge at full width just below the ' +
    'collar rim. "clear" is the tightest margin in SVG user units.');
  const g1 = grid(cols);

  for (let f = 0; f < FINIALS.length; f++) {
    for (let p = 0; p < POSTS.length; p++) {
      // Post first: the renderer may reject a finial for this post, and we want
      // to observe that rather than fight it.
      choose('post', p);
      choose('finial', f);
      const actualF = D().getElementById('finial').selectedIndex;
      if (actualF !== f) {
        // Configuration refused by the renderer (u-channel carries no decorative
        // finial). Not a rendering defect, so it is not scored.
        skipped++;
        const c = document.createElement('div');
        c.className = 'cell skip';
        c.innerHTML = '<div class="cap"><b></b><span></span></div>' +
                      '<div class="skipmsg">not a valid configuration<br>' +
                      'decorative finials are not offered on this post</div>';
        c.querySelector('b').textContent = FINIALS[f];
        c.querySelector('span').textContent = POSTS[p];
        g1.appendChild(c);
        continue;
      }
      const dbg = Object.assign({}, W().__proofDebug);
      const svg = grab(view);
      const inv = await mountInvariant(D().getElementById('proof'), dbg);
      if (me !== runId) return;
      total++;
      if (dbg.mateRatio != null && ratioClass(dbg.mateRatio, TARGET) === 'r-bad') flagged++;
      if (inv) { invTotal++; if (!inv.pass) invFail++; }
      g1.appendChild(cell(FINIALS[f], POSTS[p], svg, dbg, TARGET, inv));
    }
  }
  s1.appendChild(g1);
  out.appendChild(s1);

  // ---- base x post -------------------------------------------------------
  const s2 = section(
    'Base × post',
    'The post passes behind the base and the base occludes it; the break marker must sit ' +
    'in the run of post above the base. "run" is the measured exposed post between the ' +
    'marker and the base top, "cover" the tightest margin by which the base outreaches ' +
    'the post. The Corinthian throat clears the post interface while its outer ornament ' +
    'and catalog height are retained. See docs/ARCHITECTURE.md sections 7 and 14.');
  const g2 = grid(cols);

  const bZoom = document.getElementById('zoom').value === 'finial'
    ? 'base' : document.getElementById('zoom').value;

  for (let b = 0; b < BASES.length; b++) {
    for (let p = 0; p < POSTS.length; p++) {
      choose('post', p);
      choose('base', b);
      choose('finial', 1);
      const actualB = D().getElementById('base').selectedIndex;
      if (actualB !== b) {
        bSkipped++;
        const c = document.createElement('div');
        c.className = 'cell skip';
        c.innerHTML = '<div class="cap"><b></b><span></span></div>' +
                      '<div class="skipmsg">not a valid configuration<br>' +
                      'decorative bases are not offered on this post</div>';
        c.querySelector('b').textContent = BASES[b];
        c.querySelector('span').textContent = POSTS[p];
        g2.appendChild(c);
        continue;
      }
      const dbg  = Object.assign({}, W().__proofDebug);
      const svg  = grab(VIEWS[bZoom]);
      const binv = await baseInvariant(D().getElementById('proof'), dbg);
      if (me !== runId) return;
      if (binv) { bTotal++; if (!binv.pass) bFail++; }
      g2.appendChild(cell(BASES[b], POSTS[p], svg, null, TARGET, null, binv));
    }
  }
  s2.appendChild(g2);
  out.appendChild(s2);

  const s3 = section('Complete assemblies',
    'All posts × all configurations × None / Dogwood / Scroll brackets × both, primary-only, ' +
    'cross-only and neither street. Checks read SVG bounds for attachment, rail contact, ' +
    'lettering, clearance and clipping. Representative two-street proofs are shown below.');
  const g3 = grid(cols);
  let aTotal = 0, aFail = 0;
  const assemblyFailures = [];
  for (let p = 0; p < POSTS.length; p++) {
    choose('post', p);
    choose('base', p === 2 ? 2 : p === 3 ? 0 : 1);
    choose('finial', p === 2 ? 1 : p === 3 ? 0 : 3);
    for (let c = 0; c < 3; c++) for (const bracket of [0,1,3]) for (let state = 0; state < 4; state++) {
      choose('config', c);
      choose('bracket', bracket);
      toggle('noStreet1', !!(state & 1));
      toggle('noStreet2', !!(state & 2));
      const result = assemblyInvariant(D(), W().__proofDebug);
      aTotal++;
      const caption = POSTS[p] + ' / ' + opts('config')[c] + ' / ' + opts('bracket')[bracket] + ' / state ' + state;
      if (!result.pass) { aFail++; assemblyFailures.push({ caption, failed: result.failed }); }
      if (!result.pass || (state === 0 && bracket === (p === 3 ? 0 : 1))) {
        const card = cell(opts('config')[c], POSTS[p], grab(VIEWS.full));
        const metrics = document.createElement('div');
        metrics.className = 'metrics ' + (result.pass ? 'r-ok' : 'r-bad');
        metrics.textContent = result.pass ? 'Assembly PASS' : result.failed.join(', ');
        card.appendChild(metrics);
        if (!result.pass) card.classList.add('bad');
        g3.appendChild(card);
      }
    }
  }
  s3.appendChild(g3);
  out.appendChild(s3);

  // restore
  choose('base', 1);

  const okCount = total - flagged;
  status.innerHTML =
    '<strong>' + total + '</strong> valid finial/post combinations — sizing: ' +
    '<span class="' + (flagged ? 'fail' : 'pass') + '">' +
    (flagged ? flagged + ' outside tolerance' : okCount + ' within tolerance') +
    '</span> at ' + TARGET.toFixed(2) + 'x. Mounting invariant: ' +
    '<span class="' + (invFail ? 'fail' : 'pass') + '">' +
    (invFail ? invFail + ' of ' + invTotal + ' FAIL' : invTotal + ' pass') +
    '</span>. Base joint: ' +
    '<span class="' + (bFail ? 'fail' : 'pass') + '">' +
    (bFail ? bFail + ' of ' + bTotal + ' FAIL' : bTotal + ' pass') +
    '</span>. Assembly: ' + (aTotal-aFail) + '/' + aTotal + ' pass.' + ((skipped + bSkipped) ? ' ' + (skipped + bSkipped) +
      ' invalid configurations skipped.' : '');
  window.__testResults = { finialChecks: invTotal, finialFailures: invFail,
    baseChecks: bTotal, baseFailures: bFail, assemblyChecks: aTotal, assemblyFailures,
    invalidSkipped: skipped+bSkipped };
}

document.getElementById('zoom').addEventListener('change', build);
document.getElementById('blades').addEventListener('change', build);
document.getElementById('size').addEventListener('change', build);
document.getElementById('rerun').addEventListener('click', () => {
  rig.src = 'index.html';
  rig.addEventListener('load', build, { once: true });
});

rig.addEventListener('load', build);
build();   // covers the case where the iframe finished before this script ran
</script>
</body>
</html>

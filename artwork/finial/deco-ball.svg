<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-52 -118 104 118"
     data-asset-id="AA_Deco_Ball_Finial_v1"
     data-role="finial"
     data-shape="decorative-ball"
     data-fidelity="reference-derived"
     aria-label="AA Decorative Ball Finial">
  <metadata>
    Aluminum Accents proof asset for a decorative ball finial.
    Geometry derived from the supplied vendor reference. The upper ball retains the fuller
    visual mass of the former AA ball asset while the lower transition uses a distinct
    stepped/flared decorative shoulder. Not tied to a vendor SKU.
    Mount anchor is bottom-center at 0,0.
  </metadata>

  <!-- mount anchor: (0,0) -->
  <g class="finish" fill="#1A1A1A">
    <!-- cylindrical socket -->
    <path d="M-25,0 L-25,-17
             Q-25,-20 -21,-22
             L21,-22
             Q25,-20 25,-17
             L25,0 Z"/>

    <!-- lower decorative flare -->
    <path d="M-21,-22
             Q-27,-25 -30,-31
             Q-27,-34 -23,-36
             Q-19,-38 -16,-41
             L16,-41
             Q19,-38 23,-36
             Q27,-34 30,-31
             Q27,-25 21,-22 Z"/>

    <!-- raised collar -->
    <path d="M-16,-41
             Q-17,-45 -13,-48
             Q-9,-51 -8,-55
             L8,-55
             Q9,-51 13,-48
             Q17,-45 16,-41 Z"/>

    <!-- fuller decorative ball -->
    <path d="M0,-114
             C25,-114 42,-96 42,-73
             C42,-52 29,-37 11,-33
             C7,-32 4,-31 0,-31
             C-4,-31 -7,-32 -11,-33
             C-29,-37 -42,-52 -42,-73
             C-42,-96 -25,-114 0,-114 Z"/>
  </g>

  <g class="detail" fill="none" stroke="#4A4A4A" stroke-width="2.1"
     stroke-linecap="round" opacity="0.8">
    <path d="M-24,-23 Q0,-19 24,-23"/>
    <path d="M-25,-34 Q0,-29 25,-34"/>
    <path d="M-14,-42 Q0,-39 14,-42"/>
  </g>
</svg>

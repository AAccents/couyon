<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 1000"
     preserveAspectRatio="none"
     data-asset-id="AA_Smooth_Round_Post_v1"
     data-role="post"
     data-shape="smooth-round-post"
     data-fidelity="normalized"
     aria-label="AA Smooth Round Post">
  <metadata>
    Aluminum Accents vendor-neutral proof artwork for a smooth round post.
    This asset intentionally does not encode vendor, SKU, physical diameter, or nominal length.
    Product records in the proof generator control real post diameter, length, compatibility,
    and procurement identity. Derived from the previously used smooth round post artwork.
  </metadata>

  <!-- normalized smooth cylindrical post body -->
  <defs>
    <linearGradient id="postShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="18%" stop-color="#252525"/>
      <stop offset="44%" stop-color="#3A3A3A"/>
      <stop offset="58%" stop-color="#2B2B2B"/>
      <stop offset="82%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="100" height="1000"
        rx="50" ry="50"
        fill="url(#postShade)"/>

  <!-- restrained highlight to preserve the existing round-tube read -->
  <path d="M28,10 C33,180 33,820 28,990"
        fill="none"
        stroke="#666666"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.38"/>
</svg>
